[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "waymo-catalog-enrichment"
version = "0.1.0"
description = "Temporal VLM scenario enrichment for the Waymo Open Dataset, adapted from the NVIDIA Retail Catalog Enrichment blueprint."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.50",
  "pillow>=10",
  "pandas>=2",
  "pyarrow>=15",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/waymo_enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
